[project]
name = "personal-lms"
version = "0.1.0"
description = "Local-first, provider-portable multi-agent learning system centered on Obsidian."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2,<3",
]

[project.optional-dependencies]
crewai = [
    "crewai>=1.15.2,<1.16",
]
ollama = [
    "httpx>=0.27,<1",
]
openai-live = [
    "httpx>=0.27,<1",
]
# Narrow local fixture extra for the CCNA micro-lab: safe YAML decoding
# (PyYAML), searchable-PDF text (pdfminer.six), and PNG structure/region
# validation (Pillow). Declared directly so `uv sync --extra ccna-lab`
# acquires them without relying on CrewAI's transitive graph; the lightweight
# core (`uv sync`) does not install them.
ccna-lab = [
    "pdfminer-six>=20260107,<20270101",
    "pillow>=12.3,<13",
    "pyyaml>=6.0.3,<7",
]

[project.scripts]
personal-lms = "personal_lms.cli:main"
personal-lms-ollama-smoke-test = "personal_lms.providers.ollama.smoke_test:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/personal_lms"]

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.3",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = "crewai.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "httpx.*"
ignore_missing_imports = true

# PyYAML ships no inline types and its stub package is a separate
# distribution. Relaxing the import here — the same treatment the other
# optional extras get — keeps this clean in both core-only and ccna-lab
# modes without adding a types-only dependency for one safe_load call.
[[tool.mypy.overrides]]
module = "yaml.*"
ignore_missing_imports = true

# pdfminer.six and Pillow are ccna-lab extras, so in core-only mode their
# imports do not resolve and the required `uv run mypy src` check would fail on
# a fresh checkout. Both ship py.typed, so once the extra is installed mypy
# still binds their real types and this override goes quiet.
[[tool.mypy.overrides]]
module = ["pdfminer.*", "PIL.*"]
ignore_missing_imports = true

# In core-only mode (crewai extra not installed) crewai.* resolves to Any,
# which trips strict mode's disallow_subclassing_any/disallow_untyped_decorators
# for this one module. Relaxing just those two rules here (rather than inline
# `# type: ignore` comments) keeps this file clean in both modes: a hardcoded
# ignore would become an unused-ignore error in CrewAI-enabled mode, where
# crewai ships real types and these rules have nothing to flag anyway.
[[tool.mypy.overrides]]
module = "personal_lms.adapters.crewai.*"
disallow_subclassing_any = false
disallow_untyped_decorators = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "requires_crewai: test requires the optional 'crewai' extra to be installed",
    "requires_ollama: test requires the optional 'ollama' extra to be installed",
]
