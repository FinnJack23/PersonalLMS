    different_form_from_baseline_item: 11111111-1111-4111-8111-000000000001
    prompt: >-
      In your own words, explain why an access port cannot carry traffic
      for VLAN 20 and VLAN 30 at the same time, while a trunk port can
      carry both.
    response_schema: short_answer_v1
    rubric:
      - criterion_id: states-access-single-vlan
        description: States an access port belongs to exactly one VLAN.
        points: 5
      - criterion_id: states-trunk-multiplexes
