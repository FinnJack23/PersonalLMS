brief:
  learner_text: >
    Users associated with one VLAN cannot communicate across the link
    between LAB-SW1 and LAB-SW2. Inspect both ends, identify every
    relevant mismatch, make the minimum correction on LAB-SW2, verify
    the result, and submit both structured fault findings and the
    relevant cause codes.
  topology_text: >
    LAB-SW1 Gi0/1 connects directly to LAB-SW2 Gi0/1. Both interfaces
    should be 802.1Q trunks carrying VLANs 10, 20, and 99. VLAN 99
    should be native.

topology:
  nodes:
    - {node_id: host-a, node_type: host, attached_to: lab-sw1, access_vlan: 20}
    - {node_id: lab-sw1, node_type: synthetic_switch}
    - {node_id: lab-sw2, node_type: synthetic_switch}
    - {node_id: host-b, node_type: host, attached_to: lab-sw2, access_vlan: 20}
  links:
    - link_id: interswitch-1
      endpoint_a: lab-sw1:gi0/1
      endpoint_b: lab-sw2:gi0/1
      operational_state: up

initial_state:
  current_device: lab-sw2
  command_mode: operator
  devices:
    lab-sw1:
      vlans: [10, 20, 99]
      interfaces:
        gi0/1:
          admin_up: true
          oper_up: true
          switchport_mode: trunk
          tagging: dot1q
          native_vlan: 99
          allowed_vlans: [10, 20, 99]
    lab-sw2:
      vlans: [10, 20, 99]
      interfaces:
        gi0/1:
          admin_up: true
          oper_up: true
          switchport_mode: trunk
          tagging: dot1q
          native_vlan: 1
          allowed_vlans: [10, 99]

target_invariants:
  - invariant_id: lab-sw1-port-trunk
    severity: critical
    predicate: {type: field_equals, target: {device_id: lab-sw1, interface_id: gi0/1, field: switchport_mode}, expected: trunk}
  - invariant_id: lab-sw2-port-trunk
    severity: critical
    predicate: {type: field_equals, target: {device_id: lab-sw2, interface_id: gi0/1, field: switchport_mode}, expected: trunk}
  - invariant_id: link-remains-up
    severity: critical
    predicate: {type: link_state_equals, link_id: interswitch-1, expected: up}
  - invariant_id: lab-sw1-native-vlan
    severity: critical
    predicate: {type: field_equals, target: {device_id: lab-sw1, interface_id: gi0/1, field: native_vlan}, expected: 99}
  - invariant_id: lab-sw2-native-vlan
    severity: critical
    predicate: {type: field_equals, target: {device_id: lab-sw2, interface_id: gi0/1, field: native_vlan}, expected: 99}
  - invariant_id: lab-sw1-required-vlans-allowed
    severity: critical
    predicate: {type: set_contains_all, target: {device_id: lab-sw1, interface_id: gi0/1, field: allowed_vlans}, required: [10, 20, 99]}
  - invariant_id: lab-sw2-required-vlans-allowed
    severity: critical
    predicate: {type: set_contains_all, target: {device_id: lab-sw2, interface_id: gi0/1, field: allowed_vlans}, required: [10, 20, 99]}
  - invariant_id: lab-sw1-required-vlans-exist
    severity: critical
    predicate: {type: set_contains_all, target: {device_id: lab-sw1, field: vlans}, required: [10, 20, 99]}
  - invariant_id: lab-sw2-required-vlans-exist
    severity: critical
    predicate: {type: set_contains_all, target: {device_id: lab-sw2, field: vlans}, required: [10, 20, 99]}

known_faults:
