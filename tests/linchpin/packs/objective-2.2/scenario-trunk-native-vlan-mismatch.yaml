equivalence_cases_execution_provenance: >-
  v2: both sequences in equivalence_cases were EXECUTED through a stdlib
  clean-room reference simulator (P0 verification scaffolding, not the Gate
  2 production engine). Both reach expected_final_state_sha256 exactly, both
  end at current_device=lab-sw2 / command_mode=privileged, and each
  satisfies verification_policy (pre-change observe_trunk_summary +
  observe_switchport on BOTH lab-sw1 and lab-sw2; post-change on lab-sw2).
  Two records naming the same hash is not the proof; the executed run is.
  Starting hash 1a690fc8..., target hash 6a7d2785...

equivalence_cases:
  - case_id: eq-separate-commands
    description: >-
      Native VLAN and allowed VLAN corrected with two separate commands,
      with the required pre-change observations on both switches and
      post-change observations on LAB-SW2.
    command_sequence:
      - "enable"
      - "show interfaces trunk"                       # lab-sw2 pre
      - "show interface gi0/1 switchport"             # lab-sw2 pre
      - "connect lab-sw1"
      - "show interfaces trunk"                       # lab-sw1 pre
      - "show interface gi0/1 switchport"             # lab-sw1 pre
      - "connect lab-sw2"
      - "configure terminal"
      - "interface gi0/1"
      - "switchport trunk native vlan 99"
      - "switchport trunk allowed vlan 10,20,99"
      - "end"
      - "show interfaces trunk"                       # lab-sw2 post
      - "show interface gi0/1 switchport"             # lab-sw2 post
      - "diagnose native-vlan-mismatch device=lab-sw2 interface=gi0/1 expected=99"
      - "diagnose allowed-vlan-omission device=lab-sw2 interface=gi0/1 vlan=20"
      - "submit rationale endpoint-agreement,allowed-set-end-to-end"
      - "submit solution"
    executed: true
    verification_policy_satisfied: true
    expected_final_state_sha256: 6a7d2785a9765a2e953ff6f64925bf4d3084cfe3475b35b3608d9f86ae820b38
  - case_id: eq-incremental-allowed-vlan
    description: >-
      Allowed VLAN corrected with the incremental "add" form, native VLAN
      corrected first, with the same required pre/post observations.
    command_sequence:
      - "enable"
      - "show interfaces trunk"                       # lab-sw2 pre
      - "show interface gi0/1 switchport"             # lab-sw2 pre
      - "connect lab-sw1"
      - "show interfaces trunk"                       # lab-sw1 pre
      - "show interface gi0/1 switchport"             # lab-sw1 pre
      - "connect lab-sw2"
      - "configure terminal"
      - "interface gi0/1"
      - "switchport trunk allowed vlan add 20"
      - "switchport trunk native vlan 99"
      - "end"
      - "show interfaces trunk"                       # lab-sw2 post
      - "show interface gi0/1 switchport"             # lab-sw2 post
      - "diagnose allowed-vlan-omission device=lab-sw2 interface=gi0/1 vlan=20"
      - "diagnose native-vlan-mismatch device=lab-sw2 interface=gi0/1 expected=99"
      - "submit rationale endpoint-agreement,allowed-set-end-to-end"
      - "submit solution"
    executed: true
    verification_policy_satisfied: true
    expected_final_state_sha256: 6a7d2785a9765a2e953ff6f64925bf4d3084cfe3475b35b3608d9f86ae820b38
    grammar_note: >-
      RC-03 RESOLVED (kept & approved): the "switchport trunk allowed vlan
      add <vlan_list>" incremental-add form is in scope and distinct from
      the full-replacement form. It is declared in command_grammar below
      (operation add_allowed_vlans) and exercised by this sequence and by
      baseline item ...000009 / followup item ...000004.

command_grammar:
  allow_abbreviations: unambiguous_only
  case_sensitive: false
  # v2.1 determinism rule (H3): productions match MOST-SPECIFIC-FIRST, and the
  # generic replacement production "switchport trunk allowed vlan <vlan_list>"
  # treats "add"/"remove"/"except"/"none" as RESERVED sub-command tokens: its
  # <vlan_list> operand must begin with an integer (1..4094), never a reserved
  # token. So "switchport trunk allowed vlan add 20" can ONLY bind to
  # add_allowed_vlans, never replace_allowed_vlans -- enforced by ordering AND
  # operand token validation, so parsing is unambiguous under any match
  # strategy. Executed proof: see equivalence_cases_execution_provenance.
  match_strategy: most_specific_first
  reserved_allowed_vlan_subcommand_tokens: [add, remove, except, none]
  vlan_list_operand_rule: >-
    Comma-separated integers and ascending A-B ranges, each 1..4094, no
    duplicates after normalization; the first token must be an integer, never a
    reserved sub-command token.
  commands:
    - {mode: any, pattern: help, operation: render_help}
    - {mode: any, pattern: exit, operation: exit_or_leave_mode}
    - {mode: operator, pattern: enable, operation: enter_privileged}
    - {mode: privileged, pattern: "connect lab-sw1", operation: select_device}
    - {mode: privileged, pattern: "connect lab-sw2", operation: select_device}
    - {mode: privileged, pattern: "configure terminal", operation: enter_configuration}
    - {mode: privileged, pattern: "show interfaces trunk", operation: observe_trunk_summary}
    - {mode: privileged, pattern: "show interface gi0/1 switchport", operation: observe_switchport}
    - {mode: privileged, pattern: "show vlan brief", operation: observe_vlan_summary}
    - {mode: configuration, pattern: "interface gi0/1", operation: select_interface}
    - {mode: interface, pattern: "switchport mode trunk", operation: set_trunk_mode}
    - {mode: interface, pattern: "switchport trunk native vlan <vlan_id>", operation: set_native_vlan}
    - {mode: interface, pattern: "switchport trunk allowed vlan <vlan_list>", operation: replace_allowed_vlans}
    - {mode: interface, pattern: "switchport trunk allowed vlan add <vlan_list>", operation: add_allowed_vlans}
    - {mode: interface, pattern: "no switchport trunk native vlan", operation: restore_native_vlan_default}
    - {mode: [configuration, interface], pattern: end, operation: enter_privileged}
    - {mode: privileged, pattern: "diagnose native-vlan-mismatch device=<device_id> interface=<interface_id> expected=<vlan_id>", operation: record_native_vlan_diagnosis}
    - {mode: privileged, pattern: "diagnose allowed-vlan-omission device=<device_id> interface=<interface_id> vlan=<vlan_id>", operation: record_allowed_vlan_diagnosis}
    - {mode: privileged, pattern: "submit rationale <reason_code_list>", operation: record_rationale_codes}
    - {mode: privileged, pattern: "submit solution", operation: submit_for_grading}
  explicitly_forbidden:
    - shell_escape
    - pipe
    - redirect
    - file_access
    - subprocess
    - arbitrary_interface
    - arbitrary_protocol
  review_note: >-
    The "switchport trunk allowed vlan add <vlan_list>" operation
    (add_allowed_vlans) is a candidate addition beyond the design pack's
    05-CLI-SIMULATOR.md grammar table, added so followup item
    22222222-...-000004 and eq-incremental-allowed-vlan are executable.
    See RC-03.

verification_policy:
  required_before_change:
    - {device_id: lab-sw1, operations: [observe_trunk_summary, observe_switchport]}
    - {device_id: lab-sw2, operations: [observe_trunk_summary, observe_switchport]}
  required_after_change:
    - {device_id: lab-sw2, operations: [observe_trunk_summary, observe_switchport]}
  required_diagnoses: [native-vlan-mismatch, allowed-vlan-omission]
  required_rationale_codes: [endpoint-agreement, allowed-set-end-to-end]

grading:
  grader_id: trunk-state-rubric
  grader_version: "1.0"
  weights: {final_state: 45, verification: 25, localization_repair: 15, minimality: 10, rationale: 5}
  critical_invariant_score_cap: 69
  command_level_hint_facet_cap: 79
  minimum_cli_mastery_score: 80
  equivalent_solutions:
    allow_command_reordering: true
    allow_reapplying_correct_state: true
    penalize_unnecessary_changes_under: minimality
  deterministic_only:
    - final_state
    - verification
    - localization_repair
    - minimality
    - rationale
    - critical_invariant_caps

hints:
  - {hint_id: syntax-current-mode, kind: syntax, penalty: none, text: "Use `help` to list commands valid in the current mode."}
  - {hint_id: compare-both-ends, kind: conceptual, marks_facets_assisted: [verification_troubleshooting], evidence_claim_ids: [claim-native-vlan-agreement]}
  - {hint_id: repair-lab-sw2, kind: command_level, marks_facets_assisted: [cli_configuration, verification_troubleshooting], evidence_claim_ids: [claim-native-vlan-agreement, claim-allowed-vlan-effect]}

