# =====================================================================
# Authoring annotation (NOT a domain field): shows how each
# grounding_score was derived so a reviewer can reproduce it.
# G(c) = max(0, 100 * min(1, E1 + 0.15*E2 + 0.05*E3) - C), C=0.
# E_i = authority * directness * provenance * extraction * fitness.
# Independently recomputed with Decimal in the v2 report (all >= 85).
# =====================================================================
grounding_computation:
  E_reference_values:
    E1_synthetic_pdf: "0.850000  (0.85*1.0*1.0*1.0*1.0)"
    E2_infographic_native: "0.550800  (0.80*0.90*0.90*0.85*1.0)"
    E2_infographic_allowed: "0.550800  (0.80*0.85*0.90*0.90*1.0)"
  claim-trunk-multiple-vlans: {groups: [E1], score: "85.00", derivation: "100*min(1,0.85)=85.00"}
  claim-dot1q-identifies-vlan: {groups: [E1], score: "85.00", derivation: "100*min(1,0.85)=85.00"}
  claim-native-vlan-treatment: {groups: [E1, E2_native], score: "93.26", derivation: "100*min(1,0.85+0.15*0.5508)=100*0.93262=93.26"}
  claim-native-vlan-agreement: {groups: [E1], score: "85.00", derivation: "100*min(1,0.85)=85.00"}
  claim-allowed-vlan-effect: {groups: [E1, E2_allowed], score: "93.26", derivation: "100*min(1,0.85+0.15*0.5508)=93.26"}
  claim-trunk-verification-state: {groups: [E1], score: "85.00", derivation: "100*min(1,0.85)=85.00"}

