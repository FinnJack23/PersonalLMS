# ---------------------------------------------------------------------
# Canonicalization and hash rules
# ---------------------------------------------------------------------
canonicalization_rules:
  file_hash: "sha256 over raw file bytes."
  evidence_region_text_content_sha256: "sha256(exact_text.encode('utf-8')) for page_text regions."
  evidence_region_image_content_sha256: "sha256(b'image-region-rgb-v1\\x00' + width_u32_be + height_u32_be + crop.convert('RGB').tobytes()), crop = image.crop(pixel_box). pixel_box is DERIVED from the selector.bbox via normalized_bbox_to_pixel; it is no longer stored in the selector (v2.1 strict-compat). The derived box is recorded only in sources/ai-visual-review.yaml."
  normalized_bbox_to_pixel: "Per-edge round-half-up: floor(norm*dim + 0.5), clamped to [0,dim]; box=(left,top,right,bottom), right>left, bottom>top."
  image_hash_vs_content_sha256: "selector.image_hash = sha256 of the whole source PNG bytes; region content_sha256 = the image-region-rgb-v1 hash above. They are separate values."
  cli_state_hash: "sha256(json.dumps(canonical_payload, sort_keys=True, separators=(',',':')).encode('utf-8')); canonical_payload = {command_mode, current_device, devices:{device_id:{vlans:sorted, interfaces:{interface_id:{admin_up,oper_up,switchport_mode,tagging,native_vlan,allowed_vlans:sorted}}}}}; no timestamps/display text/event IDs. EXECUTED: start=1a690fc8..., target=6a7d2785..."
  index_content_hash: "ALGORITHM FROZEN AT WP3, NOT NOW. See plan-amendment (RC-04): P0 freezes inputs/schema; the actual index hash is generated and reviewer-accepted at the WP3 checkpoint. No value is fabricated here."
  event_stream_hash: "ALGORITHM FROZEN AT WP6, NOT NOW. See plan-amendment (RC-05): P0 freezes the canonical event model; the actual event-stream hash is generated and reviewer-accepted at the WP6 checkpoint. No value is fabricated here."

