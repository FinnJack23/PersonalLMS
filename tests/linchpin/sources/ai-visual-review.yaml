schema_version: "1.0"
record_kind: ai_technical_visual_review
status: ai_reviewed_and_human_approved

important: >
  The `ai_*` fields below are an AI technical visual review only, and by
  themselves are NOT the human approval that G1-GO-02 / G1-FX-08 require. RC-06
  was closed by a SEPARATE human action: Alan explicitly attested "I approve
  both regions". The `human_*` fields record ONLY that attestation. v2.1.1
  provenance correction: the earlier records carried a fabricated exact review
  timestamp (an invented time with false 00:00:00 precision) that was never
  supplied, and human notes that over-claimed what Alan asserted. Those are
  corrected here. Alan's
  attestation was an approval of both regions; it did NOT separately assert the
  exact visible wording, the low-contrast intent, or the accessible-description
  accuracy -- those specific conclusions belong to the AI technical review
  (ai_finding) and must not be attributed to the human reviewer.

source_id: src-objective-2.2-infographic-png
image_sha256: c8355b3514fa3c2aa48c87e48c3945a19fdf886423b5c902db968ee0351805cd
image_bytes_unchanged: true
image_pixel_dimensions: [900, 500]
normalized_bbox_to_pixel_rule: >-
  Per-edge round-half-up: pixel = floor(normalized_value * dimension + 0.5),
  clamped to [0, dimension]; box = (left, top, right, bottom) with right>left
  and bottom>top. Documented and applied identically in fixture-manifest.yaml
  and the region-hash generator.
region_content_hash_rule: >-
  sha256(b"image-region-rgb-v1\x00" + width_u32_be + height_u32_be +
  crop.convert("RGB").tobytes()), where crop = image.crop((left,top,right,
  bottom)) and width/height are the crop dimensions.

# Human attestation applies to both regions together, recorded verbatim once
# and referenced by each region below. No exact time was captured.
human_attestation:
  human_reviewer_id: alan
  approved_evidence_ids: [evid-infographic-native-region, evid-infographic-allowed-region]
  human_decision: approved
  human_approval_quote: "I approve both regions"
  human_approval_source: codex_conversation_user_message
  human_reviewed_on: "2026-07-27"
  human_reviewed_at: null
  human_reviewed_at_reason: exact_time_not_captured

reviews:
  - evidence_id: evid-infographic-native-region
    bbox_normalized: [0.44, 0.49, 0.58, 0.53]
    pixel_box: [396, 245, 522, 265]
    content_sha256: 559a0b8c866049543e13fafba9470c08f79acf0a989f7b44cdd011e7fc777325
    ai_observed_text: "native VLAN 99"
    ai_finding: >-
      AI TECHNICAL REVIEW (not human): the pixel region visibly reads "native
      VLAN 99". The label is deliberately low-contrast (light grey on white);
      this is the intended G1 low-confidence diagram-label case, not an
      extraction defect. The stored accessible_description accurately describes
      both the reading and the low-contrast intent. These conclusions are the
      AI reviewer's, not Alan's.
    ai_reviewer: automated-visual-reader (Pillow crop inspection, no OCR model)
    ai_reviewed_on: "2026-07-27"
    human_decision: approved
    human_reviewer_id: alan
    human_reviewed_on: "2026-07-27"
    human_reviewed_at: null
    human_reviewed_at_reason: exact_time_not_captured
    human_note: >-
      Covered by Alan's attestation "I approve both regions"
      (human_approval_source: codex_conversation_user_message). No additional
      human assertions beyond approval.

